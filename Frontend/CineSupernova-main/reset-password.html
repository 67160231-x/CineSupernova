<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งรหัสผ่านใหม่ - CineSupernova</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/favicon-180.png">
  <link rel="stylesheet" href="style.css">
  <style>
    body.auth-page {
      background: radial-gradient(circle at center, #2b1220 0%, #0d0c1d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      font-family: 'IBM Plex Sans Thai', sans-serif;
      color: #f8f5ff;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: rgba(30, 26, 46, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }
    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .brand-header h1 {
      font-family: 'Baloo 2', sans-serif;
      font-size: 2rem;
      color: #ffc857;
      margin: 8px 0 4px;
      letter-spacing: 1px;
    }
    .brand-header p {
      color: #a09cb0;
      font-size: 0.9rem;
      margin: 0;
    }
    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: #a09cb0;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #ff7a59;
      color: #fff;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: #d1cde0;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      background: rgba(15, 13, 25, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #ff7a59;
    }
    .error-msg {
      color: #ff4d4d;
      font-size: 0.85rem;
      text-align: center;
      margin: 8px 0;
      min-height: 20px;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #ff7a59 0%, #e50914 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }
    .btn-submit:hover {
      opacity: 0.9;
    }
    .hidden {
      display: none !important;
    }
    .link-btn {
      background: none;
      border: none;
      color: #ffa98c;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 4px 0;
      text-decoration: underline;
      font-family: inherit;
    }
    .link-btn:hover { color: #ffc857; }
    .link-btn.center { display: block; margin: 14px auto 0; }
    .forgot-row { text-align: right; margin: -6px 0 4px; }
    .forgot-title { font-weight: 700; font-size: 1.05rem; margin: 0 0 6px; color: #ffc857; text-align: center; }
    .forgot-desc { color: #a09cb0; font-size: 0.85rem; line-height: 1.6; margin: 0 0 16px; text-align: center; }
    .success-msg {
      color: #7ee8c0;
      font-size: 0.85rem;
      text-align: center;
      margin: 8px 0;
      min-height: 20px;
      line-height: 1.6;
    }
    .demo-box {
      margin: 8px 0 4px;
      padding: 10px 12px;
      border: 1px dashed rgba(255, 200, 87, 0.5);
      border-radius: 8px;
      font-size: 0.82rem;
      color: #ffc857;
      text-align: center;
      word-break: break-all;
    }
    .demo-box a { color: #7ee8c0; font-weight: 700; }
    .btn-submit:disabled { opacity: 0.55; cursor: not-allowed; }
  </style>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="brand-header">
      <img class="auth-logo" src="assets/logo.png" alt="CineSupernova logo">
      <h1>CINESUPERNOVA</h1>
      <p>ตั้งรหัสผ่านใหม่</p>
    </div>

    <!-- ลิงก์ไม่ถูกต้อง / หมดอายุ -->
    <div id="resetInvalid" class="hidden">
      <p class="forgot-title">ลิงก์ใช้ไม่ได้แล้ว</p>
      <p class="forgot-desc">ลิงก์รีเซ็ตรหัสผ่านนี้ไม่ถูกต้อง หมดอายุ หรือถูกใช้ไปแล้ว กรุณาขอลิงก์ใหม่อีกครั้ง</p>
      <a href="login.html" class="btn-submit" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box;">กลับไปหน้าเข้าสู่ระบบ</a>
    </div>

    <form id="resetForm" class="hidden" novalidate>
      <div class="form-group">
        <label>รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)</label>
        <input type="password" id="resetPassword" placeholder="ตั้งรหัสผ่านใหม่" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>ยืนยันรหัสผ่านใหม่</label>
        <input type="password" id="resetPassword2" placeholder="พิมพ์รหัสผ่านใหม่อีกครั้ง" required minlength="6" autocomplete="new-password">
      </div>
      <p id="resetMsg" class="error-msg"></p>
      <button type="submit" id="resetBtn" class="btn-submit">บันทึกรหัสผ่านใหม่</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
