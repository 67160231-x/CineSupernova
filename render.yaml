services:
  - type: web
    name: cinesupernova-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter          # ⚠️ Persistent Disk ใช้ได้เฉพาะ plan ที่ไม่ใช่ Free
    healthCheckPath: /api/health
    disk:
      name: cinesupernova-data
      mountPath: /app/Backend/data   # ต้องตรงกับ path ที่ auth.js / database.js ใช้เก็บ .sqlite
      sizeGB: 1
    # sync: false = ให้ไปกรอกค่าจริงเองใน Render Dashboard > Environment (ห้ามใส่ค่าลับในไฟล์นี้)
    envVars:
      - key: PORT
        value: 3000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
      - key: GMAIL_SCRIPT_URL
        sync: false
      - key: GMAIL_SCRIPT_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false        # (ทางเลือก) ส่งอีเมลผ่าน Brevo แทน Apps Script
      - key: MAIL_FROM_EMAIL
        sync: false        # อีเมลผู้ส่งที่ยืนยันใน Brevo แล้ว (ใช้คู่กับ BREVO_API_KEY)
      - key: MAIL_FROM_NAME
        value: CineSupernova
      - key: PASSWORD_RESET_DEMO
        value: "false"     # true = โชว์ลิงก์รีเซ็ตบนหน้าเว็บ (โหมดสาธิต) ห้ามเปิดบนเว็บจริง
      - key: TMDB_API_KEY
        sync: false
